name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ─────────────────────────────────────────────
  # Node.js — primary runtime
  # ─────────────────────────────────────────────
  test-node:
    name: Node ${{ matrix.node-version }}
    runs-on: ubuntu-latest

    strategy:
      matrix:
        # Minimum supported + current LTS
        node-version: [22, 24]

    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - run: npm ci

      - name: Typecheck (src + enforced type-test lane)
        run: npm run typecheck

      - name: Lint
        run: npx biome check src/ --diagnostic-level=error

      - name: Dead code
        run: npx knip

      - name: Dependency boundaries
        run: npm run check:boundaries

      - name: Build
        run: npm run build

      - name: Public API surface
        run: npm run check:api-surface

      - name: Package standards (publint + attw)
        run: npm run check:package

      - name: Test
        run: npx vitest run
        env:
          MONGO_URI: mongodb://localhost:27017/test

      - name: Smoke test (incl. consumer install + typecheck + e2e)
        run: npm run smoke
        env:
          SMOKE_CONSUMER: "1"
          MONGO_URI: mongodb://localhost:27017/arc_consumer_smoke

      - name: MCP E2E
        run: node scripts/mcp-e2e.mjs
        env:
          MONGODB_URI: mongodb://localhost:27017/arc_mcp_e2e

  # ─────────────────────────────────────────────
  # Peer minimums — the floors in peerDependencies must actually work.
  # Local dev proves the LATEST combination; this proves the declared
  # minimums (fastify / repo-core / primitives) still compile, build,
  # and pass the fast + contract lanes.
  # ─────────────────────────────────────────────
  peer-minimums:
    name: Peer minimums (derived from declared peerDependencies)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # DERIVED, never hardcoded. These pins were literal versions and rotted
      # silently: they still said repo-core@0.14.0 / primitives@0.9.0 while the
      # declared floors had moved to 0.24 / 0.23, so the lane that exists to
      # prove the floors are real was testing versions arc can no longer build
      # against. Reading package.json means raising a floor automatically
      # changes what CI installs, and a floor arc cannot build against fails on
      # the PR that raised it.
      - name: Pin REQUIRED peers to their declared floors
        run: |
          PINS=$(node -e "
            const p = require('./package.json');
            const meta = p.peerDependenciesMeta ?? {};
            console.log(
              Object.entries(p.peerDependencies)
                .filter(([n]) => !meta[n]?.optional)
                .map(([n, r]) => n + '@' + r.replace(/^[>=^~\s]+/, ''))
                .join(' ')
            );
          ")
          echo "Installing floors: $PINS"
          npm install --no-save $PINS

      - name: Typecheck against floors
        run: npm run typecheck

      - name: Build against floors
        run: npm run build

      - name: Fast + contract lanes against floors
        run: npm run test:fast && npx vitest run tests/contract tests/types

  # ─────────────────────────────────────────────
  # Bun — secondary runtime
  # ─────────────────────────────────────────────
  test-bun:
    name: Bun
    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # Bun needs Node for some dev tooling (tsc, vitest)
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install deps (npm for lockfile compat)
        run: npm ci

      - name: Build (tsdown uses Node)
        run: npx tsdown

      - name: Test with Bun runtime
        run: bun run vitest run
        env:
          MONGO_URI: mongodb://localhost:27017/test

      - name: Bun import check
        run: |
          bun -e "
            const arc = await import('./dist/index.mjs');
            const mcp = await import('./dist/integrations/mcp/index.mjs');
            const perms = await import('./dist/permissions/index.mjs');
            const utils = await import('./dist/utils/index.mjs');
            console.log('✓ Core exports:', Object.keys(arc).length);
            console.log('✓ MCP exports:', Object.keys(mcp).length);
            console.log('✓ Permissions exports:', Object.keys(perms).length);
            console.log('✓ Utils exports:', Object.keys(utils).length);
          "
